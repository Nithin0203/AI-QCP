<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quality – Barcode Reference Sheet</title>
  <script src="JsBarcode.all.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Encode+Sans+Expanded:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --accent:#243782; --bg:#f5f6f9; --card:#fff; --border:#ccd3e8; --text:#162250; --muted:#646b82; --mint:#43aaa0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Encode Sans","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
    header { text-align:center; margin-bottom:24px; }
    header h1 { font-size:1.3rem; font-weight:700; color:var(--accent); font-family:"Encode Sans Expanded","Segoe UI",Arial,sans-serif; }
    header p  { color:var(--muted); margin-top:5px; font-size:0.85rem; }
    .filter-bar { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:24px; }
    .filter-bar label { display:flex; align-items:center; gap:7px; font-size:0.85rem; font-weight:600; color:var(--muted); }
    .filter-bar select { border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:0.88rem; background:var(--card); color:var(--text); }
    .filter-bar button { padding:7px 18px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:0.88rem; font-weight:600; cursor:pointer; font-family:"Encode Sans Expanded","Segoe UI",Arial,sans-serif; }
    .filter-bar button.sec { background:#3d434f; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; max-width:1000px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 16px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(40,43,52,.07); cursor:pointer; transition:box-shadow .15s; }
    .card:hover { box-shadow:0 3px 14px rgba(36,55,130,.2); }
    .card svg { width:100%; height:auto; display:block; }
    .card-model  { font-size:1rem; font-weight:700; color:var(--text); text-align:center; }
    .card-station { display:inline-block; margin-top:4px; font-size:0.8rem; font-weight:600; color:var(--accent); background:#eff1fb; border-radius:4px; padding:2px 10px; }
    .card-code { font-size:0.7rem; color:var(--muted); font-family:"Courier New",monospace; }
    .card-hint { font-size:0.68rem; color:#a7adbf; }
    /* Fullscreen overlay */
    #fsOverlay { display:none; position:fixed; inset:0; z-index:9999; background:#090d20; flex-direction:column; align-items:center; justify-content:center; gap:0; }
    #fsOverlay.open { display:flex; }
    #fsWrap { background:#fff; border-radius:10px; padding:16px; width:92vw; max-width:520px; }
    #fsWrap svg { width:100%; height:auto; display:block; }
    #fsModel { color:#fff; font-size:1.15rem; font-weight:700; margin-top:16px; }
    #fsStation { color:#8798de; font-size:0.95rem; margin-top:4px; }
    #fsCode { color:rgba(255,255,255,.45); font-size:0.75rem; font-family:"Courier New",monospace; margin-top:6px; }
    #fsHint { color:rgba(255,255,255,.5); font-size:0.78rem; margin-top:10px; }
    #fsClose { position:absolute; top:14px; right:16px; background:none; border:none; color:#fff; font-size:2rem; cursor:pointer; line-height:1; }
    footer { text-align:center; margin-top:32px; font-size:0.75rem; color:var(--muted); }
    @media print {
      body { background:#fff; padding:6px; }
      .filter-bar, footer, #fsOverlay { display:none !important; }
      .grid { gap:10px; }
      .card { box-shadow:none; border:1px solid #d7d9e0; cursor:default; }
    }
  </style>
</head>
<body>
<header>
  <h1>AI Quality Inspection — Barcode Reference</h1>
  <p>Tap any barcode to go fullscreen for scanning &nbsp;|&nbsp; Print to place at stations</p>
</header>

<div class="filter-bar">
  <label>Model
    <select id="filterModel">
      <option value="">All Models</option>
      <option>Model S</option>
      <option>Model 3</option>
      <option>Model X</option>
      <option>Model Y</option>
    </select>
  </label>
  <label>Station
    <select id="filterStation">
      <option value="">All Stations</option>
      <option>ST-001</option>
      <option>ST-002</option>
      <option>ST-003</option>
    </select>
  </label>
  <button onclick="applyFilter()">Filter</button>
  <button class="sec" onclick="window.print()">&#128438; Print</button>
</div>

<div class="grid" id="grid"></div>
<footer>Stellantis &middot; AI Quality Platform &middot; v2.0</footer>

<!-- Fullscreen overlay -->
<div id="fsOverlay">
  <button id="fsClose" onclick="closeFS()">&#10005;</button>
  <div id="fsWrap"><svg id="fsSvg"></svg></div>
  <div id="fsModel"></div>
  <div id="fsStation"></div>
  <div id="fsCode"></div>
  <div id="fsHint">Hold phone camera up to the barcode above</div>
</div>

<script>
// 4-digit code: first digit = model (1=S,2=3,3=X,4=Y), last 3 = station number
var ENTRIES = [
  { code:"1001", model:"Model S", station:"ST-001" },
  { code:"1002", model:"Model S", station:"ST-002" },
  { code:"1003", model:"Model S", station:"ST-003" },
  { code:"2001", model:"Model 3", station:"ST-001" },
  { code:"2002", model:"Model 3", station:"ST-002" },
  { code:"2003", model:"Model 3", station:"ST-003" },
  { code:"3001", model:"Model X", station:"ST-001" },
  { code:"3002", model:"Model X", station:"ST-002" },
  { code:"3003", model:"Model X", station:"ST-003" },
  { code:"4001", model:"Model Y", station:"ST-001" },
  { code:"4002", model:"Model Y", station:"ST-002" },
  { code:"4003", model:"Model Y", station:"ST-003" }
];

function makeSvg(code, large) {
  var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  JsBarcode(svg, code, {
    format: "CODE128",
    lineColor: "#1a2340",
    background: "#ffffff",
    width: large ? 5 : 4,
    height: large ? 140 : 90,
    displayValue: true,
    font: "monospace",
    fontSize: large ? 18 : 14,
    textMargin: 6,
    margin: large ? 14 : 10
  });
  return svg;
}

function buildCards(mf, sf) {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  ENTRIES.forEach(function(e) {
    if (mf && e.model !== mf) return;
    if (sf && e.station !== sf) return;
    var card = document.createElement("div");
    card.className = "card";
    card.title = "Tap to enlarge for scanning";
    card.appendChild(makeSvg(e.code, false));
    var label = document.createElement("div");
    label.innerHTML =
      '<div class="card-model">'+e.model+'</div>'+
      '<div><span class="card-station">'+e.station+'</span></div>'+
      '<div class="card-code">Code: '+e.code+'</div>'+
      '<div class="card-hint">&#x1f50d; Tap to enlarge for scanning</div>';
    card.appendChild(label);
    card.addEventListener("click", function(){ openFS(e); });
    grid.appendChild(card);
  });
}

function openFS(e) {
  var fsSvg = document.getElementById("fsSvg");
  var newSvg = makeSvg(e.code, true);
  while (fsSvg.firstChild) fsSvg.removeChild(fsSvg.firstChild);
  Array.from(newSvg.attributes).forEach(function(a){ fsSvg.setAttribute(a.name, a.value); });
  fsSvg.innerHTML = newSvg.innerHTML;
  document.getElementById("fsModel").textContent = e.model;
  document.getElementById("fsStation").textContent = e.station;
  document.getElementById("fsCode").textContent = "Code: " + e.code;
  document.getElementById("fsOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
  // Keep screen bright while overlay is open
  if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){});
}

function closeFS() {
  document.getElementById("fsOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function applyFilter() {
  buildCards(document.getElementById("filterModel").value, document.getElementById("filterStation").value);
}

buildCards("","");
</script>
</body>
</html>
